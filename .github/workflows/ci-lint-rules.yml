name: CI lint-rules

on:
  push:
    paths:
      - 'lint-rules/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
    branches: [ main ]
  pull_request:
    paths:
      - '.github/workflows/ci-lint-rules.yml'
      - 'lint-rules/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run test-lint-rules

name: service-template
services:
  db:
    image: postgres:17
    ports:
      - 0:5432
    environment:
      POSTGRES_USER: "username"
      POSTGRES_PASSWORD: "randompassword"
      POSTGRES_DB: "dbname"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d dbname"]
      interval: 5s
      timeout: 5s
      retries: 10
  test-db:
    image: postgres:17
    ports:
      - 0:5432
    environment:
      POSTGRES_USER: "test_username"
      POSTGRES_PASSWORD: "test_randompassword"
      POSTGRES_DB: "test_db"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_username -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  nginx:
    build:
      context: ./middleware/nginx
    ports:
      - 0:8000
    volumes:
      - ./middleware/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./middleware/nginx/proxy.js:/etc/nginx/proxy.js:ro
      - ./middleware/nginx/dynamic:/etc/nginx/dynamic
    extra_hosts:
      - "host.docker.internal:${DOCKER_HOST_IP:-host-gateway}"
volumes:
  db-data:
